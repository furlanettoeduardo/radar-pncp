spring:
  application:
    name: radar-api
  threads:
    virtual:
      # Cheap concurrency on a 256 MB heap: no large platform thread pool to pay for.
      enabled: true
  main:
    banner-mode: off

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    build:
      enabled: true
    env:
      enabled: false

logging:
  level:
    root: INFO
