spring:
  application:
    name: radar-api
  threads:
    virtual:
      # Cheap concurrency on a 256 MB heap: no large platform thread pool to pay for.
      enabled: true
  main:
    banner-mode: off
  datasource:
    url: ${RADAR_DB_URL:jdbc:postgresql://localhost:5432/radar}
    username: ${RADAR_DB_USERNAME:radar}
    password: ${RADAR_DB_PASSWORD:radar}
    hikari:
      # Explicit, not Hikari's default of 10. Sized for a t3.micro, not for throughput.
      #
      # db.t4g.micro derives max_connections from LEAST(DBInstanceClassMemory/9531392, 5000),
      # which reads as roughly 112 on a 1 GiB instance. The real figure is lower:
      # DBInstanceClassMemory is what the instance has left after RDS overhead, not the full
      # gibibyte. Stage 8 confirms it with SHOW max_connections rather than trusting the formula.
      # Against even the pessimistic reading, 5 here plus 5 in radar-ingestion is comfortable.
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    env:
      enabled: false

logging:
  level:
    root: INFO
