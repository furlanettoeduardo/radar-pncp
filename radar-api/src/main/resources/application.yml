spring:
  application:
    name: radar-api
  threads:
    virtual:
      # Cheap concurrency on a 256 MB heap: no large platform thread pool to pay for.
      enabled: true
  main:
    banner-mode: off
  datasource:
    url: ${RADAR_DB_URL:jdbc:postgresql://localhost:5432/radar}
    username: ${RADAR_DB_USERNAME:radar}
    password: ${RADAR_DB_PASSWORD:radar}
    hikari:
      # Sized for a t3.micro, not for throughput. Raise it when a load test asks for it.
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    env:
      enabled: false

logging:
  level:
    root: INFO
