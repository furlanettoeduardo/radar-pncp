spring:
  application:
    name: radar-ingestion
  threads:
    virtual:
      # Cheap concurrency on a 256 MB heap: no large platform thread pool to pay for.
      enabled: true
  main:
    banner-mode: off

radar:
  discovery:
    # Overlaps the schedule deliberately rather than matching it. A run that looks back exactly as
    # far as the interval loses everything published during an outage, and re-reading a day costs
    # nothing because the consumer deduplicates on content hash.
    lookback-days: 2
    # Empty means every state, which is what PNCP accepts as an omitted uf.
    states: []
  pncp:
    base-url: https://pncp.gov.br/api/consulta
    # PNCP requires codigoModalidadeContratacao on every call, and 6 is the only value the
    # recorded samples evidence. A list from day one, so adding codes is config rather than code.
    # Known limitation: the system therefore sees one modality out of PNCP's catalogue.
    modality-codes:
      - 6
    # The only page size any sample evidences. Raising it is the single largest lever on request
    # volume, and there is no evidence yet that PNCP accepts more.
    page-size: 10
    # Caps the whole fan-out, not just how much runs at once. One week of SP alone is 170 pages,
    # and a daily all-states run is an estimated 100-160, so this is roughly 3x normal operation.
    # A multi-day catch-up belongs in chunking the window, not in loosening this. See ADR 0008.
    max-total-pages: 500
    max-concurrent-requests: 8
    connect-timeout: 2s
    read-timeout: 10s
    # Bounds a whole invocation, which per request timeouts do not. A healthy run at the cap is
    # roughly 500 pages over 8 at a time, about a minute; this leaves five times that. Without it
    # the worst case is 500 pages x 3 attempts x 10s, and a scheduler would start overlapping runs.
    operation-deadline: 5m
    user-agent: "radar-pncp/0.1.0 (+https://github.com/furlanettoeduardo/radar-pncp)"

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    env:
      enabled: false

logging:
  level:
    root: INFO
